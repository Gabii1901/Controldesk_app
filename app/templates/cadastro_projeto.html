<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cadastrar Projeto - ControlDesk</title>

  <link rel="stylesheet" href="{{ url_for('static', filename='styles/cadastro_projeto.css') }}?v=2">
</head>

<body class="cd-body">

  <header class="top-bar">
    <h1 class="cd-title">ControlDesk</h1>
    <a href="{{ url_for('projeto_bp.listar_projetos') }}" class="btn-voltar" title="Voltar">⮌</a>
  </header>

  <main class="cd-wrap">
    <h2 class="page-title">Cadastrar Projeto</h2>

    <div class="card-form">
      <form action="{{ url_for('projeto_bp.cadastrar_projeto') }}" method="POST">

        <div class="form-group">
          <label for="nome">Nome do Projeto</label>
          <input type="text" id="nome" name="nome" placeholder="Ex: Reforma da Filial X" required>
        </div>

        <div class="form-group">
          <label for="local">Local</label>
          <input type="text" id="local" name="local" placeholder="Ex: Chapecó - SC" required>
        </div>

        <div class="form-group">
          <label for="status">Status</label>
          <select id="status" name="status" required>
            <option value="EM ANDAMENTO">Em Andamento</option>
            <option value="CONCLUÍDO">Concluído</option>
            <option value="CANCELADO">Cancelado</option>
          </select>
        </div>

        <div class="form-group">
          <label for="empresa">Empresa</label>
          <select id="empresa" name="empresa_id" required>
            <option value="">Selecione uma Empresa</option>
            {% for empresa in empresas %}
              <option value="{{ empresa.id }}">{{ empresa.razao_social }}</option>
            {% endfor %}
          </select>
        </div>

        <div class="actions">
          <button type="submit" class="btn-primary">💾 Salvar</button>
          <a href="{{ url_for('projeto_bp.listar_projetos') }}" class="btn-secondary">❌ Cancelar</a>
        </div>

      </form>
    </div>
  </main>

</body>
</html>
