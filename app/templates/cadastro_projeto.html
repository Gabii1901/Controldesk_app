<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Projeto - ControlDesk</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/cadastro_projeto.css') }}">
</head>
<body>
    <div class="container">
        <!-- Botão Voltar -->
        <a href="{{ url_for('projeto_bp.listar_projetos') }}" class="btn-voltar">
            ⮌ Voltar
        </a>

        <!-- Título -->
        <h1 class="title">ControlDesk</h1>
        <button class="btn-projetos">Projetos</button>

        <!-- Formulário de Cadastro -->
        <form action="{{ url_for('projeto_bp.cadastrar_projeto') }}" method="POST">
            <div class="form-group">
                <label for="nome">Nome do Projeto:</label>
                <input type="text" id="nome" name="nome" required>
            </div>

            <div class="form-group">
                <label for="local">Local:</label>
                <input type="text" id="local" name="local" required>
            </div>

            <div class="form-group">
                <label for="status">Status:</label>
                <select id="status" name="status">
                    <option value="EM ANDAMENTO">Em Andamento</option>
                    <option value="CONCLUÍDO">Concluído</option>
                    <option value="CANCELADO">Cancelado</option>
                </select>
            </div>

            <div class="form-group">
                <label for="empresa">Empresa:</label>
                <select id="empresa" name="empresa_id" required>
                    <option value="">Selecione uma Empresa</option>
                    {% for empresa in empresas %}
                        <option value="{{ empresa.id }}">{{ empresa.razao_social }}</option>
                    {% endfor %}
                </select>
            </div>

            <!-- Botão de Salvar -->
            <div class="botoes">
                <button type="submit" class="btn-salvar">Salvar</button>
            </div>
        </form>
    </div>
</body>
</html>
