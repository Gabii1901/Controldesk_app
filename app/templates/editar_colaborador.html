<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Colaborador - ControlDesk</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/editar_colaborador.css') }}">
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
</head>
<body>
    <div class="container">
        <!-- Botão Voltar -->
        <a href="{{ url_for('colaborador_bp.listar_colaboradores') }}" class="btn-voltar">
            ⮌ Voltar
        </a>

        <!-- Título -->
        <h1 class="title">ControlDesk</h1>
        <button class="btn-colaboradores">Colaboradores</button>

        <!-- Informações do Colaborador -->
        <div class="colaborador-container">
            <div class="colaborador-info">
                <i class="fas fa-user"></i>
                <span> {{ colaborador.nome }} </span>
            </div>
        </div>

        <!-- Formulário de Edição -->
        <form action="{{ url_for('colaborador_bp.atualizar_colaborador', id=colaborador.id) }}" method="POST">
            <div class="form-group">
                <label for="nome">Nome:</label>
                <input type="text" id="nome" name="nome" value="{{ colaborador.nome }}" required>
            </div>

            <div class="form-group">
                <label for="cpf">CPF:</label>
                <input type="text" id="cpf" name="cpf" value="{{ colaborador.cpf }}" required>
            </div>

            <div class="form-group">
                <label for="numero_cartao">Número do Cartão:</label>
                <input type="text" id="numero_cartao" name="numero_cartao" value="{{ colaborador.numero_cartao }}" required>
            </div>

            <div class="form-group">
                <label for="projeto">Projeto:</label>
                <select id="projeto" name="projeto_id">
                    {% for projeto in projetos %}
                        <option value="{{ projeto.id }}" {% if colaborador.projeto_id == projeto.id %}selected{% endif %}>
                            {{ projeto.nome }}
                        </option>
                    {% endfor %}
                </select>
            </div>

            <!-- Botões -->
            <div class="botoes">
                <button type="submit" class="btn-salvar">Salvar</button>
                <button type="button" class="btn-excluir" onclick="confirmarExclusao()">Excluir</button>
            </div>
        </form>
    </div>

    <script>
        function confirmarExclusao() {
            if (confirm("Tem certeza que deseja excluir este colaborador?")) {
                fetch("{{ url_for('colaborador_bp.excluir_colaborador', id=colaborador.id) }}", {
                    method: "POST"
                }).then(response => {
                    if (response.ok) {
                        window.location.href = "{{ url_for('colaborador_bp.listar_colaboradores') }}";
                    }
                });
            }
        }
    </script>
</body>
</html>
