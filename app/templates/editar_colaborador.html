<!DOCTYPE html> 
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Colaborador - ControlDesk</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/editar_colaborador.css') }}">
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>

</head>
<body>
    <div class="container">
        <!-- Botão Voltar -->
        <a href="{{ url_for('colaborador_bp.listar_colaboradores') }}" class="btn-voltar">⮌ Voltar</a>

        <!-- Título -->
        <h1 class="title">ControlDesk</h1>
        <button class="btn-colaboradores">Colaboradores</button>

        <!-- Informações do Colaborador -->
        <div class="colaborador-container">
            <div class="colaborador-info">
                <i class="fas fa-user"></i>
                <span>{{ colaborador.nome }}</span>
            </div>
        </div>

        <!-- Formulário de Edição -->
        <form action="{{ url_for('colaborador_bp.atualizar_colaborador', id=colaborador.id) }}" method="POST">
            <div class="form-group">
                <label for="nome">Nome:</label>
                <input type="text" id="nome" name="nome" value="{{ colaborador.nome }}" required>
            </div>

            <div class="form-group">
                <label for="cpf">CPF:</label>
                <input type="text" id="cpf" name="cpf" value="{{ colaborador.cpf }}" required>
            </div>

            <div class="form-group">
                <label for="numero_cartao">Número do Cartão:</label>
                <input type="text" id="numero_cartao" name="numero_cartao" value="{{ colaborador.numero_cartao }}" required>
            </div>

            <!-- Projetos -->
            <div class="form-group">
                <label>Projetos:</label>
                <div class="checkbox-group">
                    {% for projeto in projetos %}
                        <div class="checkbox-item">
                            <input type="checkbox" id="projeto_{{ projeto.id }}" name="projetos" value="{{ projeto.id }}"
                                {% if projeto.id in colaborador_projetos_ids %}checked{% endif %}>
                            <label for="projeto_{{ projeto.id }}">{{ projeto.nome }}</label>
                        </div>
                    {% endfor %}
                </div>
            </div>

            <!-- Empresa -->
            <div class="form-group">
                <label for="empresa">Empresa:</label>
                <select id="empresa" name="empresa_id" required>
                    {% for empresa in empresas %}
                        <option value="{{ empresa.id }}" {% if empresa.id == colaborador.empresa_id %}selected{% endif %}>
                            {{ empresa.razao_social }}
                        </option>
                    {% endfor %}
                </select>
            </div>

            <!-- Senha -->
            <div class="form-group">
                <label for="senha">Nova Senha (opcional):</label>
                <input type="password" id="senha" name="senha">
            </div>

            <!-- Botões -->
            <div class="botoes">
                <button type="submit" class="btn-salvar">Salvar</button>
        </form>

        <!-- Form separado para ativar/inativar -->
        <form action="{{ url_for('colaborador_bp.alterar_status', id=colaborador.id) }}" method="POST">
            {% if colaborador.ativo %}
                <button type="submit" class="btn-inativar">Inativar</button>
            {% else %}
                <button type="submit" class="btn-ativar">Ativar</button>
            {% endif %}
        </form>
    </div>
</body>
</html>
