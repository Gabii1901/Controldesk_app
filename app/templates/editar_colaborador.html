<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Editar Colaborador - ControlDesk</title>

  <link rel="stylesheet" href="{{ url_for('static', filename='styles/editar_colaborador.css') }}?v=3">
</head>

<body class="cd-body">

  <header class="top-bar">
    <h1 class="cd-title">ControlDesk</h1>
    <a href="{{ url_for('colaborador_bp.listar_colaboradores') }}" class="btn-voltar" title="Voltar">⮌</a>
  </header>

  <main class="cd-wrap">
    <h2 class="page-title">Editar Colaborador</h2>

    <div class="card-form">

      <!-- Cabeçalho do card com nome -->
      <div class="entity-pill">
        <span class="pill-title">{{ colaborador.nome }}</span>
        <span class="pill-sub">CPF: {{ colaborador.cpf }}</span>
      </div>

      <!-- FORM 1: Atualizar dados -->
      <form action="{{ url_for('colaborador_bp.atualizar_colaborador', id=colaborador.id) }}" method="POST" class="form-main">

        <div class="form-group">
          <label for="nome">Nome</label>
          <input type="text" id="nome" name="nome" value="{{ colaborador.nome }}" required>
        </div>

        <div class="form-group">
          <label for="cpf">CPF</label>
          <input type="text" id="cpf" name="cpf" value="{{ colaborador.cpf }}" required>
        </div>

        <div class="form-group">
          <label for="numero_cartao">Número do Cartão</label>
          <input type="text" id="numero_cartao" name="numero_cartao" value="{{ colaborador.numero_cartao }}" required>
        </div>

        <div class="form-group">
          <label>Projetos</label>

          <div class="checkbox-scroll" role="group" aria-label="Projetos">
            {% for projeto in projetos %}
              <label class="checkbox-item" for="projeto_{{ projeto.id }}">
                <input
                  type="checkbox"
                  id="projeto_{{ projeto.id }}"
                  name="projetos"
                  value="{{ projeto.id }}"
                  {% if projeto.id in colaborador_projetos_ids %}checked{% endif %}
                >
                <span>{{ projeto.nome }}</span>
              </label>
            {% endfor %}
          </div>
        </div>

        <div class="form-group">
          <label for="empresa">Empresa</label>
          <select id="empresa" name="empresa_id" required>
            {% for empresa in empresas %}
              <option value="{{ empresa.id }}" {% if empresa.id == colaborador.empresa_id %}selected{% endif %}>
                {{ empresa.razao_social }}
              </option>
            {% endfor %}
          </select>
        </div>

        <div class="form-group">
          <label for="senha">Nova Senha (opcional)</label>
          <input type="password" id="senha" name="senha" placeholder="Deixe em branco para manter a senha atual">
        </div>

        <div class="actions">
          <button type="submit" class="btn-primary">💾 Salvar</button>
          <a href="{{ url_for('colaborador_bp.listar_colaboradores') }}" class="btn-secondary">❌ Cancelar</a>
        </div>

      </form>

      <!-- Linha divisória -->
      <div class="divider"></div>

      <!-- FORM 2: Ativar/Inativar (separado) -->
      <form action="{{ url_for('colaborador_bp.alterar_status', id=colaborador.id) }}" method="POST" class="form-status">
        {% if colaborador.ativo %}
          <button type="submit" class="btn-danger">⛔ Inativar</button>
        {% else %}
          <button type="submit" class="btn-warn">✅ Ativar</button>
        {% endif %}
      </form>

    </div>
  </main>

</body>
</html>
