<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Usuários - ControlDesk</title>

  <link rel="stylesheet" href="{{ url_for('static', filename='styles/listar_usuarios.css') }}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body class="cd-body">

  <header class="top-bar">
    <h1 class="cd-title">CONTROLDESK</h1>

    <a href="{{ url_for('dashboard_bp.dashboard') }}" class="btn-voltar" title="Voltar">
      <i class="fa-solid fa-arrow-left"></i>
    </a>
  </header>

  <div class="cd-wrap">
    <div class="page-title">Usuários</div>

    <div class="lista-usuario">
      {% for usuario in usuarios %}
        <div class="usuario-card">
          <div class="usuario-info">
            <strong>{{ usuario.nome }}</strong>
            <span>CPF: {{ usuario.cpf }}</span>
          </div>

          <a
            href="{{ url_for('user_bp.atualizar_usuario_page', id=usuario.id) }}"
            class="edit-btn"
            title="Editar usuário"
          >
            <i class="fa-solid fa-pen"></i>
          </a>
        </div>
      {% endfor %}

      <a href="{{ url_for('user_bp.cadastro_usuario_page') }}" class="usuario-card cadastro">
        <i class="fa-solid fa-plus"></i>
        <span>Cadastrar novo usuário</span>
      </a>
    </div>
  </div>

</body>
</html>
