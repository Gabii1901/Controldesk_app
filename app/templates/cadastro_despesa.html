<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ControlDesk - Despesas</title>

  <link rel="stylesheet" href="{{ url_for('static', filename='styles/despesas.css') }}">

  <!-- Font Awesome -->
  <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>

  <style>
    /* texto "obrigatório" */
    .req{
      color:#e74c3c;
      font-weight:900;
      margin-left:8px;
      display:inline-flex;
      align-items:center;
      gap:6px;
      font-size:12px;
      vertical-align:middle;
    }
    .req i{ font-size:12px; }

    .hint{
      margin-top:6px;
      font-size:12px;
      color:#666;
    }

    .is-invalid{
      border:2px solid #e74c3c !important;
      outline:none;
    }

    /* ===== PROJETOS (novo visual clicável) ===== */
    .proj-head{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      margin-bottom:10px;
    }

    .proj-list{
      display:flex;
      flex-direction:column;
      gap:10px;
    }

    /* o label vira um "card" inteiro clicável */
    .proj-item{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      padding:12px 14px;
      border:1px solid #d9d9d9;
      border-radius:10px;
      cursor:pointer;
      background:#fff;
      user-select:none;
      transition:transform .04s ease, box-shadow .12s ease, border-color .12s ease;
    }

    .proj-item:hover{
      border-color:#bdbdbd;
      box-shadow:0 2px 10px rgba(0,0,0,.06);
    }

    .proj-name{
      font-weight:600;
      color:#222;
    }

    /* esconde o radio padrão */
    .proj-item input[type="radio"]{
      position:absolute;
      opacity:0;
      pointer-events:none;
    }

    /* bolinha custom */
    .proj-dot{
      width:18px;
      height:18px;
      border-radius:50%;
      border:2px solid #9e9e9e;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      flex:0 0 auto;
    }

    .proj-dot::after{
      content:"";
      width:10px;
      height:10px;
      border-radius:50%;
      transform:scale(0);
      transition:transform .12s ease;
      background:#43a047;
    }

    /* estado marcado - com fallback JS (classe) */
    .proj-item.is-checked{
      border-color:#43a047;
      box-shadow:0 2px 12px rgba(67,160,71,.18);
    }
    .proj-item.is-checked .proj-dot{
      border-color:#43a047;
    }
    .proj-item.is-checked .proj-dot::after{
      transform:scale(1);
    }

    /* estado inválido para o bloco de projetos */
    .proj-list.is-invalid{
      border:2px solid #e74c3c;
      border-radius:12px;
      padding:10px;
      background:#fff;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1 class="title">ControlDesk - Despesas</h1>
    <p class="welcome-text">Cadastre suas despesas abaixo:</p>

    <form id="formDespesa"
          action="{{ url_for('despesa_bp.cadastro_despesa') }}"
          method="POST"
          enctype="multipart/form-data"
          novalidate>

      <div class="form-group">
        <label for="nome_colaborador">Nome do Colaborador:</label>
        <input type="text" id="nome_colaborador" name="nome_colaborador" class="form-control" value="{{ colaborador.nome }}" readonly>
      </div>

      <!-- ✅ PROJETOS (novo layout) -->
      <div class="form-group">
        <div class="proj-head">
          <label style="margin:0">
            <strong>Projeto em que está trabalhando:</strong>
          </label>
          <span class="req"><i class="fas fa-asterisk"></i> obrigatório</span>
        </div>

        <div class="proj-list" id="projList" role="radiogroup" aria-label="Projeto em que está trabalhando">
          {% for projeto in colaborador.projetos %}
            <label class="proj-item">
              <span class="proj-name">{{ projeto.nome }}</span>
              <input type="radio" name="projeto_id" value="{{ projeto.id }}" required>
              <span class="proj-dot" aria-hidden="true"></span>
            </label>
          {% endfor %}
        </div>
      </div>

      <div class="form-group">
        <label for="cidade">
          Cidade:
          <span class="req"><i class="fas fa-asterisk"></i> obrigatório</span>
        </label>
        <input type="text" id="cidade" name="cidade" required placeholder="Informe a cidade onde ocorreu a despesa">
      </div>

      <div class="form-group">
        <label for="local">
          Local:
          <span class="req"><i class="fas fa-asterisk"></i> obrigatório</span>
        </label>
        <input type="text" id="local" name="local" required placeholder="Informe o local onde ocorreu a despesa">
        <div class="hint">Ex.: Restaurante X, Loja Y, etc.</div>
      </div>

      <div class="form-group">
        <label for="cnpj_cpf_local">
          CPF/CNPJ do Local:
          <span class="req"><i class="fas fa-asterisk"></i> obrigatório</span>
        </label>
        <input type="text" id="cnpj_cpf_local" name="cnpj_cpf_local" required maxlength="18"
               placeholder="00.000.000/0000-00 ou 000.000.000-00">
        <div class="hint">Obrigatório. Preencha com CPF ou CNPJ.</div>
      </div>

      <div class="form-group">
        <label for="numero_documento">
          Número do Documento:
          <span class="req"><i class="fas fa-asterisk"></i> obrigatório</span>
        </label>
        <input type="text" id="numero_documento" name="numero_documento" required placeholder="Número do recibo, nota fiscal, etc.">
      </div>

      <div class="form-group">
        <label for="descricao">
          Descrição:
          <span class="req"><i class="fas fa-asterisk"></i> obrigatório</span>
        </label>
        <textarea id="descricao" name="descricao" required placeholder="Descreva a despesa"></textarea>
      </div>

      <div class="form-group">
        <label for="valor">
          Valor:
          <span class="req"><i class="fas fa-asterisk"></i> obrigatório</span>
        </label>
        <input type="number" step="0.01" id="valor" name="valor" required min="0.01" placeholder="0,00">
      </div>

      <div class="form-group">
        <label for="observacao">Observação:</label>
        <textarea id="observacao" name="observacao"></textarea>
        <div class="hint">Opcional.</div>
      </div>

      <div class="form-group">
        <label for="complemento">
          Complemento:
          <span class="req"><i class="fas fa-asterisk"></i> obrigatório</span>
        </label>
        <textarea id="complemento" name="complemento" required placeholder="Informe o complemento da despesa"></textarea>
        <div class="hint">Ex.: "Almoço com cliente", "Passagem aérea para reunião", etc.</div>
      </div>

      <div class="form-group">
        <label for="imagem">
          Foto do Comprovante:
          <span class="req"><i class="fas fa-asterisk"></i> obrigatório</span>
        </label>
        <input type="file" id="imagem" name="imagem" accept="image/*" required>
      </div>

      <button type="submit" class="btn btn-md">Salvar Despesa</button>
      <button type="button" class="btn btn-secondary btn-md" id="btnVoltar">Voltar</button>
    </form>
  </div>

<script>
  (function () {
    const form = document.getElementById('formDespesa');
    const projList = document.getElementById('projList');
    const btnVoltar = document.getElementById('btnVoltar');

    function markInvalid (el, invalid) {
      if (!el) return;
      if (invalid) el.classList.add('is-invalid');
      else el.classList.remove('is-invalid');
    }

    // ✅ fallback (sem :has): coloca classe no "card" selecionado
    function syncProjetoUI () {
      if (!projList) return;

      const items = projList.querySelectorAll('.proj-item');
      items.forEach(lab => lab.classList.remove('is-checked'));

      const checked = projList.querySelector('input[name="projeto_id"]:checked');
      if (checked) {
        const card = checked.closest('.proj-item');
        if (card) card.classList.add('is-checked');
        projList.classList.remove('is-invalid');
      }
    }

    if (projList) {
      projList.addEventListener('change', syncProjetoUI);
      syncProjetoUI();
    }

    // ✅ VOLTAR (vai para o menu de despesas)
    if (btnVoltar) {
      btnVoltar.addEventListener('click', function () {
        window.location.href = "{{ url_for('despesa_bp.menu_despesas') }}";
      });
    }

    // ✅ validação no submit
    if (form) {
      form.addEventListener('submit', function (e) {
        form.querySelectorAll('.is-invalid').forEach(el => el.classList.remove('is-invalid'));

        const projetoMarcado = form.querySelector('input[name="projeto_id"]:checked');
        const requiredFields = Array.from(form.querySelectorAll('[required]'));
        let ok = true;

        // projeto
        if (!projetoMarcado) {
          ok = false;
          if (projList) projList.classList.add('is-invalid');
        } else {
          if (projList) projList.classList.remove('is-invalid');
        }

        // campos required
        requiredFields.forEach((f) => {
          if (f.type === 'file') {
            const hasFile = f.files && f.files.length > 0;
            if (!hasFile) { ok = false; markInvalid(f, true); }
            return;
          }

          if (f.type === 'radio') return;

          if (!f.value || !f.value.trim()) {
            ok = false;
            markInvalid(f, true);
          }
        });

        // valor > 0
        const valor = document.getElementById('valor');
        if (valor && (Number(valor.value) <= 0 || isNaN(Number(valor.value)))) {
          ok = false;
          markInvalid(valor, true);
        }

        if (!ok) {
          e.preventDefault();
          alert('Preencha todos os campos obrigatórios antes de salvar.');
        }
      });
    }
  })();
</script>
</body>
</html>
