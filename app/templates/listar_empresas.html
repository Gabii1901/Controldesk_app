<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Empresas - ControlDesk</title>

  <link rel="stylesheet" href="{{ url_for('static', filename='styles/listar_empresas.css') }}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body class="cd-body">

  <header class="top-bar">
    <h1 class="cd-title">CONTROLDESK</h1>

    <a href="{{ url_for('dashboard_bp.dashboard') }}" class="btn-voltar" title="Voltar">
      <i class="fa-solid fa-arrow-left"></i>
    </a>
  </header>

  <div class="cd-wrap">

    <div class="page-title">Empresas</div>

    <div class="lista-empresas">
      {% for empresa in empresas %}
        <div class="empresa-card">
          <div class="empresa-info">
            <strong>{{ empresa.razao_social }}</strong>
            <span>{{ empresa.cnpj }}</span>
          </div>

          <a
            href="{{ url_for('empresa_bp.editar_empresa', id=empresa.id) }}"
            class="edit-btn"
            title="Editar empresa"
          >
            <i class="fa-solid fa-pen"></i>
          </a>
        </div>
      {% endfor %}

      <a
        href="{{ url_for('empresa_bp.cadastro_empresa_page') }}"
        class="empresa-card cadastro"
      >
        <i class="fa-solid fa-plus"></i>
        <span>Cadastrar nova empresa</span>
      </a>
    </div>

  </div>

</body>
</html>
