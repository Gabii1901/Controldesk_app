<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cadastro de Colaborador - ControlDesk</title>

  <link rel="stylesheet" href="{{ url_for('static', filename='styles/cadastro_colaboradores.css') }}?v=3">
</head>

<body class="cd-body">

  <header class="top-bar">
    <h1 class="cd-title">ControlDesk</h1>
    <a href="{{ url_for('colaborador_bp.listar_colaboradores') }}" class="btn-voltar" title="Voltar">⮌</a>
  </header>

  <main class="cd-wrap">
    <h2 class="page-title">Cadastro de Colaborador</h2>

    <div class="card-form">
      <form action="{{ url_for('colaborador_bp.criar_colaborador') }}" method="POST">

        <div class="form-group">
          <label for="nome">Nome</label>
          <input type="text" id="nome" name="nome" placeholder="Nome do colaborador" required>
        </div>

        <div class="form-group">
          <label for="cpf">CPF</label>
          <input type="text" id="cpf" name="cpf" placeholder="XXX.XXX.XXX-XX" required>
        </div>

        <div class="form-group">
          <label for="senha">Senha</label>
          <input type="password" id="senha" name="senha" placeholder="Senha de acesso" required>
        </div>

        <div class="form-group">
          <label for="numero_cartao">Número do Cartão</label>
          <input type="text" id="numero_cartao" name="numero_cartao" placeholder="4 dígitos" required>
        </div>

        <div class="form-group">
          <label for="empresa">Empresa</label>
          <select id="empresa" name="empresa_id" required>
            <option value="">Selecione uma Empresa</option>
            {% for empresa in empresas %}
              <option value="{{ empresa.id }}">{{ empresa.razao_social }}</option>
            {% endfor %}
          </select>
        </div>

        <div class="form-group">
          <label>Projetos</label>
          <div class="checkbox-scroll">
            {% for projeto in projetos %}
              <label class="checkbox-item" for="projeto_{{ projeto.id }}">
                <input
                  type="checkbox"
                  id="projeto_{{ projeto.id }}"
                  name="projetos[]"
                  value="{{ projeto.id }}"
                />
                <span>{{ projeto.nome }}</span>
              </label>
            {% endfor %}
          </div>
        </div>

        <div class="actions">
          <button type="submit" class="btn-primary">Salvar</button>
          <a href="{{ url_for('colaborador_bp.listar_colaboradores') }}" class="btn-secondary">Cancelar</a>
        </div>

      </form>
    </div>
  </main>

</body>
</html>
