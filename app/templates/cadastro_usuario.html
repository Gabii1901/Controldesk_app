<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cadastro de Usuário - ControlDesk</title>

  <link rel="stylesheet" href="{{ url_for('static', filename='styles/cadastro_usuario.css') }}?v=2">
</head>

<body class="cd-body">

  <!-- HEADER -->
  <header class="top-bar">
    <h1 class="cd-title">ControlDesk</h1>
  </header>

  <!-- CONTEÚDO -->
  <main class="cd-wrap">
    <h2 class="page-title">Cadastro de Usuário</h2>

    <div class="card-form">
      <form action="/cadastro_usuario" method="POST">

        <div class="form-group">
          <label for="nome">Nome Completo</label>
          <input
            type="text"
            id="nome"
            name="nome"
            placeholder="Digite o nome completo"
            required
          >
        </div>

        <div class="form-group">
          <label for="cpf">CPF</label>
          <input
            type="text"
            id="cpf"
            name="cpf"
            placeholder="XXX.XXX.XXX-XX"
            required
          >
        </div>

        <div class="form-group">
          <label for="senha">Senha</label>
          <input
            type="password"
            id="senha"
            name="senha"
            placeholder="Senha de acesso"
            required
          >
        </div>

        <div class="actions">
          <button type="submit" class="btn-primary">
            💾 Cadastrar
          </button>

          <a href="/usuarios/listar" class="btn-secondary">
            ❌ Cancelar
          </a>
        </div>
      </form>
    </div>
  </main>
</body>
</html>
