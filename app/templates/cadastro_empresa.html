<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cadastro de Empresas - ControlDesk</title>

  <!-- CSS específico desta tela -->
  <link rel="stylesheet" href="{{ url_for('static', filename='styles/cadastrar_empresas.css') }}">
</head>

<body class="cd-body">

  <!-- ===== HEADER ===== -->
  <header class="top-bar">
    <h1 class="cd-title">ControlDesk</h1>

    <a href="{{ url_for('empresa_bp.listar_empresas') }}" class="btn-voltar" title="Voltar">
      ⮌
    </a>
  </header>

  <!-- ===== CONTEÚDO ===== -->
  <main class="cd-wrap">

    <h2 class="page-title">Cadastro de Empresas</h2>

    <div class="card-form">

      <form action="{{ url_for('empresa_bp.cadastro_empresa') }}" method="POST">

        <div class="form-group">
          <label for="razao_social">Nome / Razão Social</label>
          <input
            type="text"
            id="razao_social"
            name="razao_social"
            placeholder="Digite a razão social"
            required
          >
        </div>

        <div class="form-group">
          <label for="cnpj">CNPJ</label>
          <input
            type="text"
            id="cnpj"
            name="cnpj"
            placeholder="00.000.000/0000-00"
            required
          >
        </div>

        <div class="form-group">
          <label for="endereco">Endereço</label>
          <input
            type="text"
            id="endereco"
            name="endereco"
            placeholder="Endereço completo da empresa"
            required
          >
        </div>

        <div class="actions">
          <button type="submit" class="btn-primary">
            💾 Salvar
          </button>

          <a href="{{ url_for('empresa_bp.listar_empresas') }}" class="btn-secondary">
            ❌ Cancelar
          </a>
        </div>

      </form>
    </div>

  </main>

</body>
</html>
