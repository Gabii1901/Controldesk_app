<!-- templates/base.html -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ControlDesk{% endblock %}</title>

    {% block styles %}{% endblock %}

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background: #f4f4f4;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        .nav {
            background: #333;
            padding: 10px;
            text-align: center;
        }
        .nav a {
            color: white;
            margin: 0 15px;
            text-decoration: none;
        }
        button {
            background: #28a745;
            color: white;
            border: none;
            padding: 10px;
            cursor: pointer;
        }
        button:hover {
            background: #218838;
        }
    </style>
</head>
<body>
    <div class="nav">
        <a href="/dashboard">Home</a>
        <a href="/cadastro_usuario">Usuários</a>
        <a href="/cadastro_empresa">Empresas</a>
        <a href="/cadastro_projeto">Projetos</a>
        <a href="/cadastro_colaborador">Colaboradores</a>
        <a href="/cadastro_despesa">Despesas</a>
        <a href="/relatorios">Relatórios</a>
    </div>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
