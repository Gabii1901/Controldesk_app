<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ControlDesk - Menu do Colaborador</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles/menu_despesas.css') }}">
</head>
<body>

  <!-- Topo -->
  <div class="top-bar">
    <span class="logo">CONTROLDESK</span>

    <div class="top-actions">
      <a href="{{ url_for('auth_bp.logout') }}" class="icon-btn" title="Sair">
        ⎋
      </a>
    </div>
  </div>

  <!-- Conteúdo -->
  <div class="container">

    <div class="welcome-card">
      <p class="welcome-text">BEM-VINDO</p>
      <strong>{{ colaborador.nome }}</strong>
    </div>

    <div class="menu">

      <a href="{{ url_for('despesa_bp.cadastro_despesa_page') }}" class="menu-item">
        <span class="icon">📋</span>
        <span>Nova Despesa</span>
      </a>

      <a href="{{ url_for('despesa_bp.historico_despesas') }}" class="menu-item">
        <span class="icon">🔄</span>
        <span>Histórico de Despesas</span>
      </a>

    </div>
  </div>

</body>
</html>
