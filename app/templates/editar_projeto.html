<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Editar Projeto - ControlDesk</title>

  <link rel="stylesheet" href="{{ url_for('static', filename='styles/editar_projeto.css') }}?v=3">
</head>

<body class="cd-body">

  <header class="top-bar">
    <h1 class="cd-title">ControlDesk</h1>
    <a href="{{ url_for('projeto_bp.listar_projetos') }}" class="btn-voltar" title="Voltar">⮌</a>
  </header>

  <main class="cd-wrap">
    <h2 class="page-title">Editar Projeto</h2>

    <div class="card-form">

      <div class="entity-pill">
        <span class="pill-title">{{ projeto.nome }}</span>
        <span class="pill-sub">Local: {{ projeto.local }}</span>
      </div>

      <!-- FORM 1: Atualizar -->
      <form action="{{ url_for('projeto_bp.atualizar_projeto', id=projeto.id) }}" method="POST">

        <div class="form-group">
          <label for="nome">Nome do Projeto</label>
          <input type="text" id="nome" name="nome" value="{{ projeto.nome }}" required>
        </div>

        <div class="form-group">
          <label for="local">Local</label>
          <input type="text" id="local" name="local" value="{{ projeto.local }}" required>
        </div>

        <div class="form-group">
          <label for="empresa">Empresa</label>
          <select id="empresa" name="empresa_id" required>
            {% for empresa in empresas %}
              <option value="{{ empresa.id }}" {% if empresa.id == projeto.empresa_id %}selected{% endif %}>
                {{ empresa.razao_social }}
              </option>
            {% endfor %}
          </select>
        </div>

        <div class="form-group">
          <label for="status">Status</label>
          <select id="status" name="status" required>
            <option value="EM ANDAMENTO" {% if projeto.status == "EM ANDAMENTO" %}selected{% endif %}>Em Andamento</option>
            <option value="CONCLUÍDO" {% if projeto.status == "CONCLUÍDO" %}selected{% endif %}>Concluído</option>
            <option value="CANCELADO" {% if projeto.status == "CANCELADO" %}selected{% endif %}>Cancelado</option>
          </select>
        </div>

        <div class="actions">
          <button type="submit" class="btn-primary">💾 Salvar</button>
          <a href="{{ url_for('projeto_bp.listar_projetos') }}" class="btn-secondary">❌ Cancelar</a>
        </div>

      </form>

      <div class="divider"></div>

      <!-- FORM 2: Excluir -->
      <form action="{{ url_for('projeto_bp.excluir_projeto', id=projeto.id) }}" method="POST" class="form-danger">
        <button type="submit" class="btn-danger">🗑️ Excluir Projeto</button>
      </form>

    </div>
  </main>

</body>
</html>
