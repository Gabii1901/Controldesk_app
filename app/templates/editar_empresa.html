<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Empresa - ControlDesk</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/editar_empresa.css') }}">
</head>
<body>
    <header>
        <h1 class="title">Editar Empresa</h1>
        <a href="{{ url_for('empresa_bp.listar_empresas') }}" class="btn-voltar">⮌ Voltar</a>
    </header>

    <form action="{{ url_for('empresa_bp.editar_empresa', id=empresa.id) }}" method="POST" class="form-container">
        <label for="razao_social">Razão Social:</label>
        <input type="text" id="razao_social" name="razao_social" value="{{ empresa.razao_social }}" required>

        <label for="cnpj">CNPJ:</label>
        <input type="text" id="cnpj" name="cnpj" value="{{ empresa.cnpj }}" required>

        <label for="endereco">Endereço:</label>
        <input type="text" id="endereco" name="endereco" value="{{ empresa.endereco }}" required>

        <button type="submit" class="btn-salvar">💾 Salvar Alterações</button>
    </form>
</body>
</html>
