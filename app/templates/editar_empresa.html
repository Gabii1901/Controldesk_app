<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Editar Empresa - ControlDesk</title>

  <link rel="stylesheet" href="{{ url_for('static', filename='styles/editar_empresa.css') }}?v=3">
</head>

<body class="cd-body">

  <header class="top-bar">
    <h1 class="cd-title">ControlDesk</h1>
    <a href="{{ url_for('empresa_bp.listar_empresas') }}" class="btn-voltar" title="Voltar">⮌</a>
  </header>

  <main class="cd-wrap">
    <h2 class="page-title">Editar Empresa</h2>

    <div class="card-form">

      <div class="entity-pill">
        <span class="pill-title">{{ empresa.razao_social }}</span>
        <span class="pill-sub">CNPJ: {{ empresa.cnpj }}</span>
      </div>

      <form action="{{ url_for('empresa_bp.editar_empresa', id=empresa.id) }}" method="POST">

        <div class="form-group">
          <label for="razao_social">Razão Social</label>
          <input type="text" id="razao_social" name="razao_social" value="{{ empresa.razao_social }}" required>
        </div>

        <div class="form-group">
          <label for="cnpj">CNPJ</label>
          <input type="text" id="cnpj" name="cnpj" value="{{ empresa.cnpj }}" required>
        </div>

        <div class="form-group">
          <label for="endereco">Endereço</label>
          <input type="text" id="endereco" name="endereco" value="{{ empresa.endereco }}" required>
        </div>

        <div class="actions">
          <button type="submit" class="btn-primary">💾 Salvar Alterações</button>
          <a href="{{ url_for('empresa_bp.listar_empresas') }}" class="btn-secondary">❌ Cancelar</a>
        </div>

      </form>
    </div>
  </main>

</body>
</html>
