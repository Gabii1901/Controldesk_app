<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ControlDesk - Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/login.css') }}">
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
</head>
<body>
    <header>
        <h1 class="title">ControlDesk</h1>
    </header>

    <div class="container">
        <div class="login-box">
            <img src="{{ url_for('static', filename='Imagens/UserIcon SF.png') }}" alt="User Icon" class="user-icon">
            
            <form action="{{ url_for('auth_bp.login') }}" method="POST">
                <label for="cpf">Usuário</label>
                <input type="text" id="cpf" name="cpf" placeholder="coloque seu usuário aqui" required>
                
                <label for="senha">Senha</label>
                <div class="password-container">
                    <input type="password" id="senha" name="senha" placeholder="sua senha aqui" required>
                    <i class="fas fa-eye toggle-password" onclick="togglePassword()"></i>
                </div>
                
                <button type="submit" class="login-btn">
                    <i class="fas fa-arrow-right"></i>
                </button>

                <div class="remember-me">
                    <label for="remember">Mantenha-me Conectado</label>
                    <input type="checkbox" id="remember" checked>
                </div>
            </form>
        </div>
    </div>

<script>
    function togglePassword() {
        var senhaInput = document.getElementById("senha");
        var icon = document.querySelector(".toggle-password");

        if (senhaInput.type === "password") {
            senhaInput.type = "text";
            icon.classList.remove("fa-eye");
            icon.classList.add("fa-eye-slash");
        } else {
            senhaInput.type = "password";
            icon.classList.remove("fa-eye-slash");
            icon.classList.add("fa-eye");
        }
    }
</script>
</body>
</html>
