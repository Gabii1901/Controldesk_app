<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Colaboradores - ControlDesk</title>

  <link rel="stylesheet" href="{{ url_for('static', filename='styles/listar_colaboradores.css') }}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body class="cd-body">

  <!-- HEADER -->
  <header class="top-bar">
    <h1 class="cd-title">CONTROLDESK</h1>

    <a href="{{ url_for('dashboard_bp.dashboard') }}" class="btn-voltar" title="Voltar">
      <i class="fa-solid fa-arrow-left"></i>
    </a>
  </header>

  <!-- CONTEÚDO -->
  <div class="cd-wrap">

    <div class="page-title">Colaboradores</div>

    <div class="lista-colaboradores">
      {% for colaborador in colaboradores %}
        <div class="colaborador-card">
          <div class="colaborador-info">
            <strong>{{ colaborador.nome }}</strong>
            <span>Cartão {{ colaborador.numero_cartao }}</span>
          </div>

          <a
            href="{{ url_for('colaborador_bp.editar_colaborador', id=colaborador.id) }}"
            class="edit-btn"
            title="Editar colaborador"
          >
            <i class="fa-solid fa-pen"></i>
          </a>
        </div>
      {% endfor %}

      <a
        href="{{ url_for('colaborador_bp.cadastro_colaborador_page') }}"
        class="colaborador-card cadastro"
      >
        <i class="fa-solid fa-plus"></i>
        <span>Cadastrar novo colaborador</span>
      </a>
    </div>

  </div>

</body>
</html>
